# Local services for developing the desktop app. The app itself is not
# containerised: point it (or `make run/dev`) at these.
#   PostgreSQL: postgres://user:password@localhost:5434/emailclient?sslmode=disable
#   Redis:      redis://localhost:6380/0
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: emailclient
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d emailclient"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local SMTP catcher: SMTP localhost:1025, UI http://localhost:8025.
  # Start it with: docker compose --profile dev up -d mailpit
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["dev"]
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
  redis_data:
